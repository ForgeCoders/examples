<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JavaScript Counter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="counter">
      <h1>Counter</h1>
      <p id="value" class="value" aria-live="polite">0</p>
      <div class="controls">
        <button id="decrement" type="button">Decrement</button>
        <button id="increment" type="button">Increment</button>
      </div>
      <button id="reset" class="reset" type="button">Reset</button>
    </main>
    <script src="script.js"></script>
  </body>
</html>
